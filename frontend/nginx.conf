server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El front llama a /api con rutas relativas: se reenvia al servicio "backend" de compose
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El service worker y su manifiesto no se cachean, para que tome las versiones nuevas
    location ~ ^/(ngsw\.json|ngsw-worker\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
    }

    # Rutas de Angular (router del lado del cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
