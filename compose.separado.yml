# compose con 3 contenedores separados: db (PostgreSQL), backend (Spring Boot) y frontend (Angular en Nginx).
# El frontend reenvia /api al backend (ver frontend/nginx.conf), asi que no hace falta CORS.
# Uso (desde la raiz): podman-compose -f compose.separado.yml up --build
#   front -> http://localhost:4200
#   API   -> http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    container_name: glossup-db
    environment:
      POSTGRES_DB: glossup
      POSTGRES_USER: glossup
      POSTGRES_PASSWORD: glossup
    ports:
      - "5432:5432"
    volumes:
      - glossup_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glossup -d glossup"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glossup-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      GLOSSUP_JWT_SECRET: cambia-este-secreto-de-desarrollo-min-32-bytes!!
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glossup-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  glossup_pgdata:
    # mismo volumen que crea backend/docker-compose.yml, para no perder los datos
    name: backend_glossup_pgdata
