openapi: 3.0.3
info:
  title: GlossUP API
  description: |
    API REST del backend GlossUP para autenticación y gestión del catálogo
    de productos cosméticos e ingredientes INCI.
  version: 0.0.1
  contact:
    name: Equipo GlossUP - Universidad del Quindío
  license:
    name: Uso académico

servers:
  - url: http://localhost:8080
    description: Desarrollo local

tags:
  - name: Salud
    description: Verificación del estado de la aplicación
  - name: Autenticación
    description: Inicio de sesión y emisión de tokens JWT
  - name: Catálogo
    description: Consulta y registro de productos cosméticos
  - name: Perfil Dermatológico
    description: Consulta y gestión dinámica de alergias y afecciones del cliente (HU2)

paths:
  /ping:
    get:
      tags:
        - Salud
      summary: Verificar que la aplicación está activa
      operationId: ping
      security: []
      responses:
        '200':
          description: Aplicación disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
              example:
                service: glossup-backend
                status: UP
                timestamp: '2026-10-15T19:00:00-05:00'

  /api/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión (Cliente, Vendedor o Admin)
      description: |
        Valida el correo y la contraseña de un usuario activo y devuelve un JWT
        con sus roles para consumir los endpoints protegidos de la plataforma.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: vendedor@glossup.com
              password: mi-password
      responses:
        '200':
          description: Credenciales válidas y token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiJ9...
                usuarioId: 1
                email: vendedor@glossup.com
                roles:
                  - VENDEDOR
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales inválidas o usuario inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/auth/register:
    post:
      tags:
        - Autenticación
      summary: Registrar un usuario
      description: Crea una cuenta activa de cliente o vendedor. El rol ADMIN no puede asignarse mediante este endpoint público.
      operationId: registrarUsuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarUsuarioRequest'
            example:
              email: cliente@glossup.com
              nombre: Cliente GlossUP
              password: mi-password-seguro
              rol: CLIENTE
      responses:
        '201':
          description: Usuario creado correctamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/BusinessRuleError'

  /api/catalogo/productos:
    post:
      tags:
        - Catálogo
      summary: Registrar un producto
      description: |
        Registra un producto con imágenes y ficha técnica INCI. El vendedor
        se obtiene del subject del JWT y no se envía en el body.
      operationId: registrarProducto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarProductoRequest'
            example:
              nombre: Serum Hidratante
              marca: GlossLab
              categoria: Cuidado facial
              precio: 85000.00
              stock: 50
              ph: 5.5
              registroInvima: NSOC12345-23CO
              imagenes:
                - https://ejemplo.com/serum.jpg
              ingredientes:
                - inci: Hyaluronic Acid
                  descripcion: Ingrediente hidratante
                  concentracion: 2.0
      responses:
        '201':
          description: Producto registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/BusinessRuleError'

  /api/catalogo/productos/{id}:
    get:
      tags:
        - Catálogo
      summary: Consultar un producto por ID
      operationId: buscarProductoPorId
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Catálogo
      summary: Modificar un producto existente (HU4)
      description: |
        Actualiza los datos generales, stock, hipervínculos de imágenes y ficha INCI
        de un producto perteneciente al vendedor autenticado.
      operationId: actualizarProducto
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarProductoRequest'
      responses:
        '200':
          description: Producto modificado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
    delete:
      tags:
        - Catálogo
      summary: Eliminar lógicamente un producto (HU4)
      description: |
        Despublica (activo = false) un producto perteneciente al vendedor autenticado,
        protegiendo el historial de pedidos.
      operationId: eliminarProducto
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Producto eliminado lógicamente (despublicado)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/catalogo/productos/mis-productos:
    get:
      tags:
        - Catálogo
      summary: Listar productos del vendedor autenticado
      description: Devuelve los productos asociados al vendedor identificado por el JWT.
      operationId: listarMisProductos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de productos del vendedor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/perfil/me:
    get:
      tags:
        - Perfil Dermatológico
      summary: Obtener mi perfil dermatológico
      description: |
        Retorna el perfil dermatológico del cliente autenticado. Si aún no existe,
        crea y persiste automáticamente un perfil inicial vacío.
      operationId: obtenerMiPerfil
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil dermatológico del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - Perfil Dermatológico
      summary: Actualizar mi biotipo dermatológico
      description: Actualiza pH, tipo de piel y tipo de cabello del cliente autenticado.
      operationId: actualizarMiPerfil
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/BusinessRuleError'

  /api/perfil/me/alergias:
    post:
      tags:
        - Perfil Dermatológico
      summary: Agregar una alergia (INCI) al perfil (HU2)
      description: Agrega dinámicamente un ingrediente cosmético (INCI) a la lista de alergias del cliente sin duplicados.
      operationId: agregarAlergia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlergiaRequest'
      responses:
        '200':
          description: Alergia agregada y perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
    delete:
      tags:
        - Perfil Dermatológico
      summary: Quitar una alergia (INCI) del perfil mediante body (HU2)
      description: Elimina dinámicamente un ingrediente (INCI) de la lista de alergias del cliente.
      operationId: quitarAlergiaPorBody
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlergiaRequest'
      responses:
        '200':
          description: Alergia eliminada y perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/perfil/me/alergias/{alergia}:
    delete:
      tags:
        - Perfil Dermatológico
      summary: Quitar una alergia (INCI) del perfil por ruta (HU2)
      operationId: quitarAlergiaPorRuta
      security:
        - bearerAuth: []
      parameters:
        - name: alergia
          in: path
          required: true
          description: Nombre INCI del ingrediente a eliminar de las alergias
          schema:
            type: string
          example: parfum
      responses:
        '200':
          description: Alergia eliminada y perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/perfil/me/afecciones:
    post:
      tags:
        - Perfil Dermatológico
      summary: Agregar una afección o condición dermatológica al perfil (HU2)
      description: Agrega dinámicamente una condición dermatológica (ej. acné, rosácea, dermatitis) al perfil del cliente.
      operationId: agregarAfeccion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AfeccionRequest'
      responses:
        '200':
          description: Afección agregada y perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
    delete:
      tags:
        - Perfil Dermatológico
      summary: Quitar una afección o condición del perfil mediante body (HU2)
      operationId: quitarAfeccionPorBody
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AfeccionRequest'
      responses:
        '200':
          description: Afección eliminada y perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/perfil/me/afecciones/{afeccion}:
    delete:
      tags:
        - Perfil Dermatológico
      summary: Quitar una afección o condición del perfil por ruta (HU2)
      operationId: quitarAfeccionPorRuta
      security:
        - bearerAuth: []
      parameters:
        - name: afeccion
          in: path
          required: true
          description: Nombre de la afección o condición a eliminar
          schema:
            type: string
          example: rosacea
      responses:
        '200':
          description: Afección eliminada y perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido mediante POST /api/auth/login

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Identificador del producto
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  schemas:
    PingResponse:
      type: object
      required:
        - service
        - status
        - timestamp
      properties:
        service:
          type: string
          example: glossup-backend
        status:
          type: string
          example: UP
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Correo electrónico del vendedor
          example: vendedor@glossup.com
        password:
          type: string
          format: password
          minLength: 1
          description: Contraseña del vendedor
          example: mi-password

    LoginResponse:
      type: object
      required:
        - token
        - usuarioId
        - email
        - nombre
        - roles
      properties:
        token:
          type: string
          description: JWT firmado para autenticar las siguientes solicitudes
        usuarioId:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: vendedor@glossup.com
        nombre:
          type: string
          example: Vendedor GlossUP
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - CLIENTE
              - VENDEDOR
              - ADMIN
          example:
            - VENDEDOR

    RegistrarUsuarioRequest:
      type: object
      required:
        - email
        - nombre
        - password
        - rol
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 120
        rol:
          type: string
          enum:
            - CLIENTE
            - VENDEDOR

    RegistrarProductoRequest:
      type: object
      required:
        - nombre
        - precio
        - ingredientes
      properties:
        nombre:
          type: string
          minLength: 1
          description: Nombre comercial del producto
          example: Serum Hidratante
        marca:
          type: string
          nullable: true
          example: GlossLab
        categoria:
          type: string
          nullable: true
          example: Cuidado facial
        precio:
          type: number
          format: double
          minimum: 0
          example: 85000.00
        stock:
          type: integer
          minimum: 0
          default: 0
          example: 50
        ph:
          type: number
          format: double
          nullable: true
          example: 5.5
        registroInvima:
          type: string
          nullable: true
          example: NSOC12345-23CO
        imagenes:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            description: URL de una imagen del producto
        ingredientes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IngredienteRequest'

    IngredienteRequest:
      type: object
      required:
        - inci
      properties:
        inci:
          type: string
          minLength: 1
          description: Nombre INCI del ingrediente
          example: Hyaluronic Acid
        descripcion:
          type: string
          nullable: true
          example: Ingrediente hidratante
        concentracion:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true
          example: 2.0

    ProductoResponse:
      type: object
      required:
        - id
        - vendedorId
        - nombre
        - precio
        - stock
        - activo
        - imagenes
        - ingredientes
        - creadoEn
      properties:
        id:
          type: integer
          format: int64
          example: 1
        vendedorId:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Serum Hidratante
        marca:
          type: string
          nullable: true
          example: GlossLab
        categoria:
          type: string
          nullable: true
          example: Cuidado facial
        precio:
          type: number
          format: double
          example: 85000.00
        stock:
          type: integer
          example: 50
        ph:
          type: number
          format: double
          nullable: true
          example: 5.5
        registroInvima:
          type: string
          nullable: true
          example: NSOC12345-23CO
        activo:
          type: boolean
          example: true
        imagenes:
          type: array
          items:
            type: string
            format: uri
        ingredientes:
          type: array
          items:
            $ref: '#/components/schemas/IngredienteResponse'
        creadoEn:
          type: string
          format: date-time

    IngredienteResponse:
      type: object
      required:
        - inci
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          example: 1
        inci:
          type: string
          example: Hyaluronic Acid
        descripcion:
          type: string
          nullable: true
          example: Ingrediente hidratante
        concentracion:
          type: number
          format: double
          nullable: true
          example: 2.0

    AlergiaRequest:
      type: object
      required:
        - alergia
      properties:
        alergia:
          type: string
          minLength: 1
          maxLength: 120
          description: Nombre INCI del ingrediente al que el cliente es alérgico
          example: Parfum

    AfeccionRequest:
      type: object
      required:
        - afeccion
      properties:
        afeccion:
          type: string
          minLength: 1
          maxLength: 120
          description: Nombre de la afección o condición dermatológica
          example: Rosácea

    PerfilResponse:
      type: object
      required:
        - usuarioId
        - afecciones
        - alergias
        - actualizadoEn
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          example: 10
        usuarioId:
          type: integer
          format: int64
          example: 7
        ph:
          type: number
          format: double
          nullable: true
          example: 5.2
        tipoPiel:
          type: string
          nullable: true
          enum:
            - NORMAL
            - SECA
            - GRASA
            - MIXTA
            - SENSIBLE
          example: MIXTA
        tipoCabello:
          type: string
          nullable: true
          maxLength: 120
          example: greñudo
        afecciones:
          type: array
          uniqueItems: true
          items:
            type: string
          example:
            - rosácea
        alergias:
          type: array
          uniqueItems: true
          items:
            type: string
          example:
            - parfum
        actualizadoEn:
          type: string
          format: date-time

    ActualizarPerfilRequest:
      type: object
      properties:
        ph:
          type: number
          format: double
          minimum: 0
          maximum: 14
          nullable: true
        tipoPiel:
          type: string
          nullable: true
          enum:
            - NORMAL
            - SECA
            - GRASA
            - MIXTA
            - SENSIBLE
        tipoCabello:
          type: string
          maxLength: 120
          nullable: true

    ApiError:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
        - detalles
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Error de validacion
        path:
          type: string
          example: /api/catalogo/productos
        detalles:
          type: array
          items:
            type: string

  responses:
    BadRequest:
      description: Solicitud inválida o error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Token ausente, inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: El usuario autenticado no tiene permisos suficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BusinessRuleError:
      description: Regla de negocio incumplida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
