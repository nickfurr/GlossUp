          maxLength: 150
          minLength: 0
          type: string
    ClaveRequest:
      required:
      - actual
      - nueva
      type: object
      properties:
        actual:
          type: string
        nueva:
          description: Debe tener entre 8 y 120 caracteres y combinar letras mayúsculas, minúsculas, números y caracteres especiales
          maxLength: 120
          minLength: 8
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^a-zA-Z0-9]).{8,120}$'
          type: string
    ActualizarProductoRequest:
      required:
      - ingredientes
      - nombre
      - precio
      type: object
      properties:
        nombre:
          type: string
        marca:
          type: string
        categoria:
          type: string
        precio:
          minimum: 0.0
          exclusiveMinimum: false
          type: number
        stock:
          minimum: 0
          type: integer
          format: int32
        ph:
          type: number
          format: double
        registroInvima:
          type: string
        imagenes:
          type: array
          items:
            type: string
        ingredientes:
          type: array
          items:
            $ref: '#/components/schemas/IngredienteRequest'
