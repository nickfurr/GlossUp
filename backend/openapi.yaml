      description: 'Evaluación por lote para el catálogo y el carrito: carga el perfil
        y las reglas una sola vez. Los ids inexistentes se omiten. Máximo 200 productos
        por petición.'
      operationId: evaluarLote
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResultadoCompatibilidadResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU7 - Validación compatibilidad producto–perfil (tipo de piel
        y comedogenia)

