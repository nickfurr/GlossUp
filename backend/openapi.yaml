  # Ruta: /api/compatibilidad/cruces
  #   GET: [HU8 - Validación compatibilidad producto–producto (cruces en carrito)]
  # --------------------------------------------------------------------------
  /api/compatibilidad/cruces:
    get:
      tags:
      - Compatibilidad
      summary: Cruces entre productos del carrito (HU8)
      description: Devuelve cada par de productos con ingredientes que no conviene combinar,
        con la causa. No depende del perfil. Máximo 200 productos por petición.
      operationId: cruces
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CruceResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU8 - Validación compatibilidad producto–producto (cruces
        en carrito)

  # --------------------------------------------------------------------------
  # Ruta: /api/compatibilidad/catalogo
  #   GET: [HU13 - Filtrado avanzado del catálogo por tipo de piel y exclusión de alérgenos]
  # --------------------------------------------------------------------------
  /api/compatibilidad/catalogo:
    get:
      tags:
      - Compatibilidad
      summary: Filtros dermatológicos del catálogo (HU13)
      description: Ids de los productos del catálogo aptos para el tipo de piel elegido
        (oculta los comedogénicos, irritantes o con pH inadecuado para esa piel) y,
        con excluirAlergenos=true, sin ingredientes de los alérgenos guardados en mi
        perfil. Sin filtros devuelve todo el catálogo.
      operationId: filtrarCatalogo
      parameters:
      - name: tipoPiel
        in: query
        required: false
        schema:
          type: string
      - name: excluirAlergenos
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: integer
                  format: int64
      security:
      - bearerAuth: []
      x-historia-usuario: HU13 - Filtrado avanzado del catálogo por tipo de piel y exclusión de alérgenos

