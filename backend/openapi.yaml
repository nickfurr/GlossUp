openapi: 3.0.1
info:
  title: GlossUP API
  description: API del ecommerce de cosmetica con motor de compatibilidad dermatologica
  contact:
    name: Equipo GlossUP - Universidad del Quindio
  license:
    name: Uso academico
  version: v0.0.1
servers:
- url: https://glossup.agreeablehill-726dcf29.eastus.azurecontainerapps.io
  description: Entorno desplegado en Azure Container Apps
- url: http://localhost:8080
  description: Entorno de desarrollo local
tags:
- name: Perfil Dermatológico
  description: Consulta y gestión dinámica de alergias y afecciones del cliente (HU2)
- name: Autenticación
  description: Recuperación de contraseña
- name: Carrito
  description: Gestión del carrito de compras del cliente (HU9)
- name: Pedidos
  description: Consolidación de carrito, reserva de inventario y consulta de pedidos
    (HU9)
- name: Envíos
  description: Cotización y seguimiento de envíos (HU14)
- name: Comprobantes
  description: Comprobante de compra en PDF (HU11)
- name: Pagos
  description: Pago de pedidos con pasarela externa (HU10)
- name: Catálogo
  description: Gestión de catálogo de productos cosméticos e ingredientes INCI
- name: Ventas del vendedor
  description: Pedidos pagados con productos del vendedor y sus cifras
- name: Cuenta
  description: Datos de la cuenta propia
- name: Catálogo
  description: Catálogo cerrado de ingredientes INCI
- name: Administración
  description: Usuarios, vendedores y moderación del catálogo
- name: Direcciones
  description: Libreta de direcciones de entrega (HU14)
- name: Compatibilidad
  description: 'Motor de compatibilidad: producto–perfil (HU6, HU7) y producto–producto
    (HU8)'

# ==============================================================================
# RUTAS Y ENDPOINTS ORGANIZADOS POR MÓDULO DEL PROYECTO
# ==============================================================================
paths:

  # ============================================================================
  # MÓDULO 1: IDENTIDAD, AUTENTICACIÓN Y CUENTAS (com.glossup.usuarios)
  # ============================================================================

  # --------------------------------------------------------------------------
  # Ruta: /api/auth/register
  #   POST: [por definir]
  # --------------------------------------------------------------------------
  /api/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarUsuarioRequest'
        required: true
      responses:
        '200':
          description: OK
      x-historia-usuario: por definir

  # --------------------------------------------------------------------------
  # Ruta: /api/auth/login
  #   POST: [por definir]
  # --------------------------------------------------------------------------
  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
      x-historia-usuario: por definir

  # --------------------------------------------------------------------------
  # Ruta: /api/auth/recuperar
  #   POST: [por definir]
  # --------------------------------------------------------------------------
  /api/auth/recuperar:
    post:
      tags:
      - Autenticación
      summary: Pedir el enlace de recuperación
      description: Responde igual exista o no el correo.
      operationId: solicitar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRequest'
        required: true
      responses:
        '202':
          description: Accepted
      x-historia-usuario: por definir

  # --------------------------------------------------------------------------
  # Ruta: /api/auth/restablecer
  #   POST: [por definir]
  # --------------------------------------------------------------------------
  /api/auth/restablecer:
    post:
      tags:
      - Autenticación
      summary: Crear la contraseña nueva con el enlace
      operationId: restablecer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerRequest'
        required: true
      responses:
        '204':
          description: No Content
      x-historia-usuario: por definir

  # --------------------------------------------------------------------------
  # Ruta: /api/cuenta/nombre
  #   PUT: [por definir]
  # --------------------------------------------------------------------------
  /api/cuenta/nombre:
    put:
      tags:
      - Cuenta
      summary: Cambiar mi nombre
      operationId: cambiarNombre
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NombreRequest'
        required: true
      responses:
        '204':
          description: No Content
      security:
      - bearerAuth: []
      x-historia-usuario: por definir

  # --------------------------------------------------------------------------
  # Ruta: /api/cuenta/clave
  #   PUT: [por definir]
  # --------------------------------------------------------------------------
  /api/cuenta/clave:
    put:
      tags:
      - Cuenta
      summary: Cambiar mi contraseña
      description: Exige la contraseña actual; si no coincide responde 422.
      operationId: cambiarClave
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaveRequest'
        required: true
      responses:
        '204':
          description: No Content
      security:
      - bearerAuth: []
      x-historia-usuario: por definir

  # --------------------------------------------------------------------------
  # Ruta: /api/cuenta/eliminar
  #   POST: [Ley 1581 - supresión de la cuenta por su titular]
  # --------------------------------------------------------------------------
  /api/cuenta/eliminar:
    post:
      tags:
      - Cuenta
      summary: Eliminar mi cuenta
      description: Borra el perfil dermatológico y las direcciones, y deja la cuenta anónima e inactiva. Los pedidos se conservan por obligación legal. Exige la contraseña actual; un administrador no puede eliminar su cuenta (422).
      operationId: eliminarCuenta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EliminarCuentaRequest'
        required: true
      responses:
        '204':
          description: No Content
      security:
      - bearerAuth: []
      x-historia-usuario: Ley 1581 - derechos del titular

  # ============================================================================
  # MÓDULO 2: PERFIL DERMATOLÓGICO Y CAPILAR (com.glossup.perfil - HU1, HU2)
  # ============================================================================

  # --------------------------------------------------------------------------
  # Ruta: /api/perfil/me
  #   GET: [HU1 - Registro y consulta del perfil dermatológico]
  #   PUT: [HU1 - Registro y consulta del perfil dermatológico]
  # --------------------------------------------------------------------------
  /api/perfil/me:
    get:
      tags:
      - Perfil Dermatológico
      summary: Obtener mi perfil dermatológico
      description: Retorna el perfil dermatológico del cliente autenticado. Si aún no
        existe, crea uno inicial vacío.
      operationId: obtenerMiPerfil
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PerfilResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU1 - Registro y consulta del perfil dermatológico
    put:
      tags:
      - Perfil Dermatológico
      summary: Actualizar mi perfil dermatológico
      operationId: actualizarPerfil
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PerfilResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU1 - Registro y consulta del perfil dermatológico
    delete:
      tags:
      - Perfil Dermatológico
      summary: Revocar la autorización y borrar mi perfil
      description: Borra el biotipo, las alergias y las afecciones (Ley 1581 art. 8 e).
      operationId: eliminarMiPerfil
      responses:
        '204':
          description: No Content
      security:
      - bearerAuth: []
      x-historia-usuario: Ley 1581 - derechos del titular

  # --------------------------------------------------------------------------
  # Ruta: /api/perfil/me/autorizacion
  #   POST: [Ley 1581 - autorización explícita de datos sensibles]
  # --------------------------------------------------------------------------
  /api/perfil/me/autorizacion:
    post:
      tags:
      - Perfil Dermatológico
      summary: Autorizar el uso de mis datos de salud
      description: Autorización explícita y facultativa (Ley 1581 art. 6). Sin ella no se pueden guardar biotipo, alergias ni afecciones (422).
      operationId: autorizarDatosSensibles
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PerfilResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: Ley 1581 - autorización de datos sensibles

  # --------------------------------------------------------------------------
  # Ruta: /api/perfil/me/alergias
  #   POST: [HU2 - Gestión dinámica de alergias y condiciones (Agregar)]
  #   DELETE: [HU2 - Gestión dinámica de alergias y condiciones (Quitar por body)]
  # --------------------------------------------------------------------------
  /api/perfil/me/alergias:
    post:
      tags:
      - Perfil Dermatológico
      summary: Agregar una alergia (INCI) al perfil (HU2)
      description: Agrega dinámicamente un ingrediente cosmético (INCI) a la lista de
        alergias del cliente sin duplicados.
      operationId: agregarAlergia
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlergiaRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PerfilResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU2 - Gestión dinámica de alergias y condiciones (Agregar)
    delete:
      tags:
      - Perfil Dermatológico
      summary: Quitar una alergia (INCI) del perfil mediante body (HU2)
      description: Elimina dinámicamente un ingrediente (INCI) de la lista de alergias
        del cliente.
      operationId: quitarAlergiaPorBody
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlergiaRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PerfilResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU2 - Gestión dinámica de alergias y condiciones (Quitar por
        body)

  # --------------------------------------------------------------------------
  # Ruta: /api/perfil/me/alergias/{alergia}
  #   DELETE: [HU2 - Gestión dinámica de alergias y condiciones (Quitar por ruta)]
  # --------------------------------------------------------------------------
  /api/perfil/me/alergias/{alergia}:
    delete:
      tags:
      - Perfil Dermatológico
      summary: Quitar una alergia (INCI) del perfil por parámetro de ruta (HU2)
      description: Elimina dinámicamente un ingrediente (INCI) de la lista de alergias
        del cliente.
      operationId: quitarAlergiaPorRuta
      parameters:
      - name: alergia
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PerfilResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU2 - Gestión dinámica de alergias y condiciones (Quitar por
        ruta)

  # --------------------------------------------------------------------------
  # Ruta: /api/perfil/me/afecciones
  #   POST: [HU2 - Gestión dinámica de alergias y condiciones (Agregar)]
  #   DELETE: [HU2 - Gestión dinámica de alergias y condiciones (Quitar por body)]
  # --------------------------------------------------------------------------
  /api/perfil/me/afecciones:
    post:
      tags:
      - Perfil Dermatológico
      summary: Agregar una afección o condición dermatológica al perfil (HU2)
      description: Agrega dinámicamente una condición dermatológica (ej. acné, rosácea,
        dermatitis) al perfil del cliente.
      operationId: agregarAfeccion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AfeccionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PerfilResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU2 - Gestión dinámica de alergias y condiciones (Agregar)
    delete:
      tags:
      - Perfil Dermatológico
      summary: Quitar una afección o condición del perfil mediante body (HU2)
      description: Elimina dinámicamente una condición dermatológica del perfil del
        cliente.
      operationId: quitarAfeccionPorBody
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AfeccionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PerfilResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU2 - Gestión dinámica de alergias y condiciones (Quitar por
        body)

  # --------------------------------------------------------------------------
  # Ruta: /api/perfil/me/afecciones/{afeccion}
  #   DELETE: [HU2 - Gestión dinámica de alergias y condiciones (Quitar por ruta)]
  # --------------------------------------------------------------------------
  /api/perfil/me/afecciones/{afeccion}:
    delete:
      tags:
      - Perfil Dermatológico
      summary: Quitar una afección o condición del perfil por parámetro de ruta (HU2)
      description: Elimina dinámicamente una condición dermatológica del perfil del
        cliente.
      operationId: quitarAfeccionPorRuta
      parameters:
      - name: afeccion
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PerfilResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU2 - Gestión dinámica de alergias y condiciones (Quitar por
        ruta)

  # --------------------------------------------------------------------------
  # Ruta: /api/perfil/me/opciones
  #   GET: [HU2 - Catálogo clínico normalizado de opciones de perfil]
  # --------------------------------------------------------------------------
  /api/perfil/me/opciones:
    get:
      tags:
      - Perfil Dermatológico
      summary: Catálogos del perfil
      description: Tipos de piel y cabello, alergias y afecciones válidas para las listas
        desplegables.
      operationId: opciones
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OpcionesPerfilResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU2 - Catálogo clínico normalizado de opciones de perfil

  # ============================================================================
  # MÓDULO 3: CATÁLOGO DE PRODUCTOS E INGREDIENTES INCI (com.glossup.catalogo - HU3, HU4, HU5, HU12, HU13)
  # ============================================================================

  # --------------------------------------------------------------------------
  # Ruta: /api/catalogo/productos
  #   GET: [HU3 / HU4 - Listar catálogo publicado con stock]
  #   POST: [HU3 - Registro manual de producto, ficha INCI e imágenes]
  # --------------------------------------------------------------------------
  /api/catalogo/productos:
    get:
      tags:
      - Catálogo
      summary: Listar el catálogo publicado
      description: Productos activos y con stock (los agotados no se muestran al cliente).
      operationId: listarCatalogo
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU3 / HU4 - Listar catálogo publicado con stock
    post:
      tags:
      - Catálogo
      summary: Registrar un nuevo producto en el catálogo (HU3)
      description: Registra un producto con sus hipervínculos de imágenes y ficha INCI
        completa obligatoria. Requiere rol VENDEDOR.
      operationId: registrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarProductoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductoResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU3 - Registro manual de producto, ficha INCI e imágenes

  # --------------------------------------------------------------------------
  # Ruta: /api/catalogo/productos/{id}
  #   GET: [HU3 / HU4 - Consultar producto por ID]
  #   PUT: [HU4 - Modificación integral de catálogo y ficha INCI]
  #   DELETE: [HU4 - Eliminación lógica (despublicar: activo=false)]
  # --------------------------------------------------------------------------
  /api/catalogo/productos/{id}:
    get:
      tags:
      - Catálogo
      summary: Consultar producto por ID
      operationId: buscarPorId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductoResponse'
      x-historia-usuario: HU3 / HU4 - Consultar producto por ID
    put:
      tags:
      - Catálogo
      summary: Modificar un producto existente del catálogo (HU4)
      description: Actualiza los datos generales, stock, imágenes y ficha INCI de un
        producto perteneciente al vendedor autenticado.
      operationId: actualizar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarProductoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductoResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU4 - Modificación integral de catálogo y ficha INCI
    delete:
      tags:
      - Catálogo
      summary: Eliminar lógicamente un producto del catálogo (HU4)
      description: Despublica (activo = false) un producto perteneciente al vendedor
        autenticado, preservando la integridad de pedidos históricos.
      operationId: eliminar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
      security:
      - bearerAuth: []
      x-historia-usuario: 'HU4 - Eliminación lógica (despublicar: activo=false)'

  # --------------------------------------------------------------------------
  # Ruta: /api/catalogo/productos/{id}/publicar
  #   POST: [HU4 - Reactivación y publicación de producto]
  # --------------------------------------------------------------------------
  /api/catalogo/productos/{id}/publicar:
    post:
      tags:
      - Catálogo
      summary: Volver a publicar un producto dado de baja
      operationId: publicar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ProductoResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU4 - Reactivación y publicación de producto

  # --------------------------------------------------------------------------
  # Ruta: /api/catalogo/productos/extraer-ingredientes
  #   POST: [HU5 - Lectura OCR asistida de ingredientes desde imagen (Gemini Vision)]
  # --------------------------------------------------------------------------
  /api/catalogo/productos/extraer-ingredientes:
    post:
      tags:
      - Catálogo
      summary: Extraer ingredientes INCI desde foto de etiqueta (HU5)
      description: Gemini Vision analiza la imagen y devuelve la lista de ingredientes
        INCI. Requiere rol VENDEDOR.
      operationId: extraerIngredientes
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - imagen
              type: object
              properties:
                imagen:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/IngredientesImagenResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU5 - Lectura OCR asistida de ingredientes desde imagen (Gemini
        Vision)

  # --------------------------------------------------------------------------
  # Ruta: /api/catalogo/productos/buscar
  #   GET: [HU12 - Búsqueda básica de productos por palabra clave]
  # --------------------------------------------------------------------------
  /api/catalogo/productos/buscar:
    get:
      tags:
      - Catálogo
      summary: Buscar productos por palabra clave (HU12)
      description: Busqueda basica de productos publicados y con stock cuyo nombre,
        marca o categoria contengan la palabra clave.
      operationId: buscar
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU12 - Búsqueda básica de productos por palabra clave

  # --------------------------------------------------------------------------
  # Ruta: /api/catalogo/productos/mis-productos
  #   GET: [HU4 / HU13 - Listar productos del vendedor autenticado]
  # --------------------------------------------------------------------------
  /api/catalogo/productos/mis-productos:
    get:
      tags:
      - Catálogo
      summary: Listar productos del vendedor autenticado
      operationId: listarMisProductos
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU4 / HU13 - Listar productos del vendedor autenticado

  # --------------------------------------------------------------------------
  # Ruta: /api/catalogo/ingredientes
  #   GET: [HU3 - Consulta del catálogo cerrado de ingredientes INCI]
  # --------------------------------------------------------------------------
  /api/catalogo/ingredientes:
    get:
      tags:
      - Catálogo
      summary: Buscar en el catálogo de ingredientes
      description: Busca por nombre INCI o por nombre en español (ej. 'glicerina').
        Máximo 20 resultados.
      operationId: buscar_1
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngredienteCatalogoResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU3 - Consulta del catálogo cerrado de ingredientes INCI

  # ============================================================================
  # MÓDULO 4: MOTOR DE COMPATIBILIDAD Y CRUCE DERMATOLÓGICO (com.glossup.compatibilidad - HU6, HU7, HU8)
  # ============================================================================

  # --------------------------------------------------------------------------
  # Ruta: /api/compatibilidad/producto/{productoId}
  #   GET: [HU6 - Validación compatibilidad producto–perfil (alergias e irritantes)]
  # --------------------------------------------------------------------------
  /api/compatibilidad/producto/{productoId}:
    get:
      tags:
      - Compatibilidad
      summary: Evaluar un producto contra mi perfil (HU6)
      description: Cruza la ficha INCI del producto con las alergias e irritantes de
        mi perfil. Devuelve si es compatible y las alertas con su causa (RNF-05).
      operationId: evaluar
      parameters:
      - name: productoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultadoCompatibilidadResponse'
      security:
      - bearerAuth: []
      x-historia-usuario: HU6 - Validación compatibilidad producto–perfil (alergias
        e irritantes)

  # --------------------------------------------------------------------------
  # Ruta: /api/compatibilidad/productos
  #   GET: [HU6 / HU7 - Evaluación por lote producto–perfil (alergias, tipo de piel y comedogenia)]
  # --------------------------------------------------------------------------
  /api/compatibilidad/productos:
