# ==============================================================================
# COMPONENTES Y ESQUEMAS DE DATOS (SCHEMAS Y SEGURIDAD)
# ==============================================================================
components:
  schemas:
    ActualizarPerfilRequest:
      type: object
      properties:
        ph:
          maximum: 14.0
          exclusiveMaximum: false
          minimum: 0.0
          exclusiveMinimum: false
          type: number
          format: double
        tipoPiel:
          type: string
        tipoCabello:
          maxLength: 120
          minLength: 0
          type: string
    PerfilResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        ph:
          type: number
          format: double
        tipoPiel:
          type: string
        tipoCabello:
          type: string
        afecciones:
          uniqueItems: true
          type: array
          items:
            type: string
        alergias:
          uniqueItems: true
          type: array
          items:
            type: string
        actualizadoEn:
          type: string
          format: date-time
        autorizacionSensiblesEn:
          type: string
          format: date-time
          description: Cuándo autorizó el titular el uso de sus datos de salud; null si no lo ha hecho.
    DireccionRequest:
      required:
      - barrio
      - ciudad
      - departamento
      - direccion
      - nombreRecibe
      - telefono
      type: object
      properties:
        nombreRecibe:
          maxLength: 120
          minLength: 0
          type: string
        telefono:
          pattern: 3\d{9}|60\d{8}
          type: string
        departamento:
          maxLength: 40
          minLength: 0
          type: string
        ciudad:
          maxLength: 80
          minLength: 0
          type: string
        barrio:
          maxLength: 80
          minLength: 0
          type: string
        direccion:
          maxLength: 160
          minLength: 0
          type: string
        complemento:
          maxLength: 120
          minLength: 0
          type: string
        indicaciones:
          maxLength: 300
          minLength: 0
          type: string
        principal:
          type: boolean
    Direccion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        usuarioId:
          type: integer
          format: int64
        nombreRecibe:
          type: string
        telefono:
          type: string
        departamento:
          type: string
        ciudad:
          type: string
        barrio:
          type: string
        direccion:
          type: string
        complemento:
          type: string
        indicaciones:
          type: string
        principal:
          type: boolean
    NombreRequest:
