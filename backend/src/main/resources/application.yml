spring:
  application:
    name: glossup-backend

  datasource:
    # Lee la BD de variables de entorno (Neon en Azure); default localhost para desarrollo local.
    url: ${GLOSSUP_DB_URL:jdbc:postgresql://localhost:5432/glossup}
    username: ${GLOSSUP_DB_USER:glossup}
    password: ${GLOSSUP_DB_PASSWORD:glossup}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Si la BD no responde, falla en 5 s (y el handler devuelve 503) en vez de colgar la petición ~30 s (auditoría R-16).
      # No bajar de 5 s: Neon tarda en despertar la base suspendida por inactividad.
      connection-timeout: 5000
      validation-timeout: 2000
      maximum-pool-size: ${GLOSSUP_DB_POOL:10}

  jpa:
    hibernate:
      # El esquema solo lo cambia Flyway (auditoría R-08). shortcut: 'none' y no 'validate' porque hay
      # columnas con tipo distinto al de la entidad (producto.ph NUMERIC vs Double); pasar a validate al alinearlas.
      ddl-auto: none
    open-in-view: false
    # Imprimir cada consulta frena el contenedor de producción (0.25 vCPU); actívalo solo para depurar.
    show-sql: ${GLOSSUP_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        # Carga imágenes y composición de muchos productos en pocas consultas IN (...) en vez de una por producto.
        default_batch_fetch_size: 100

  # Correo del comprobante (HU11). Servidor y credenciales por variables SPRING_MAIL_HOST, SPRING_MAIL_PORT,
  # SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD; sin SPRING_MAIL_HOST no se envía correo.
  mail:
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  # Las fotos de etiquetas (HU5) tomadas con el celular suelen pasar del 1 MB por defecto.
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  # Azure Container Apps (y Cloud Run) inyectan el puerto por la variable PORT.
  port: ${PORT:8080}
  tomcat:
    threads:
      # 0.25 vCPU y 10 conexiones: 200 hilos (por defecto) solo se apilan esperando el pool (auditoría OBS-RES-04).
      max: ${GLOSSUP_TOMCAT_HILOS:50}
  # El catálogo completo pesa ~130 KB en JSON; comprimido baja a una fracción.
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Un SMTP caído no debe marcar la app como no saludable (Azure la reiniciaría).
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

glossup:
  rate-limit:
    enabled: ${GLOSSUP_RATE_LIMIT_ENABLED:true}
    # Proxies de confianza delante de la app (ingress de ACA = 1). 0 = ignorar X-Forwarded-For.
    trusted-proxies: ${GLOSSUP_RATE_LIMIT_TRUSTED_PROXIES:1}
    cache:
      expire-after-access: 10m
      maximum-size: 50000
    default-limit:
      capacity: 20
      refill-tokens: 20
      refill-period: 1m
    endpoints:
      "[/api/auth/login]":
        capacity: 10
        refill-tokens: 10
        refill-period: 1m
      "[/api/auth/register]":
        capacity: 5
        refill-tokens: 5
        refill-period: 10m
      "[/api/auth/recuperar]":
        capacity: 3
        refill-tokens: 3
        refill-period: 15m
      "[/api/auth/restablecer]":
        capacity: 5
        refill-tokens: 5
        refill-period: 15m
  security:
    tarpit:
      base-delay-ms: ${GLOSSUP_TARPIT_BASE_DELAY_MS:500}
      max-delay-ms: ${GLOSSUP_TARPIT_MAX_DELAY_MS:4000}
      expire-minutes: ${GLOSSUP_TARPIT_EXPIRE_MINUTES:5}
    jwt:
      # Sin valor por defecto: si falta GLOSSUP_JWT_SECRET la app no arranca (auditoría R-01).
      secret: ${GLOSSUP_JWT_SECRET}
      expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4200,http://localhost:3000
  # Dirección pública del front: Wompi devuelve al cliente a {url-publica}/pago/resultado/{pedido}.
  url-publica: ${GLOSSUP_URL_PUBLICA:http://localhost:4200}
  correo:
    # Dirección "De" de los correos (la misma cuenta del SMTP, p. ej. la de Gmail).
    remitente: ${GLOSSUP_CORREO_REMITENTE:${SPRING_MAIL_USERNAME:}}
  pagos:
    wompi:
      # Llaves del panel de Wompi (Desarrolladores). Sandbox: pub_test_, test_integrity_, test_events_.
      llave-publica: ${WOMPI_LLAVE_PUBLICA:}
      secreto-integridad: ${WOMPI_SECRETO_INTEGRIDAD:}
      secreto-eventos: ${WOMPI_SECRETO_EVENTOS:}
      api-url: ${WOMPI_API_URL:https://sandbox.wompi.co/v1}
  envios:
    # API de la transportadora (HU14). Sin URL se usa la transportadora de demostración, que asigna la guía
    # y entrega el pedido minutos-por-etapa después de que el vendedor confirma el envío.
    url: ${GLOSSUP_ENVIOS_URL:}
    api-key: ${GLOSSUP_ENVIOS_API_KEY:}
    # Secreto que la transportadora manda en X-Envios-Secreto al reportar etapas. Sin él, el webhook rechaza todo.
    secreto-eventos: ${GLOSSUP_ENVIOS_SECRETO_EVENTOS:}
    simulador:
      minutos-por-etapa: ${GLOSSUP_ENVIOS_MINUTOS_POR_ETAPA:3}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:REEMPLAZAR-CON-TU-KEY}
      model: gemini-flash-latest
      endpoint: https://generativelanguage.googleapis.com/v1beta/models