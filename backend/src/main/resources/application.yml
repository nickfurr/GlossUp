spring:
  application:
    name: glossup-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/glossup
    username: glossup
    password: glossup
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Cambiado a 'update' para que genere o actualice las tablas automaticamente al arrancar
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

glossup:
  security:
    jwt:
      secret: cambia-este-secreto-de-desarrollo-min-32-bytes!!
      expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4200,http://localhost:3000
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:REEMPLAZAR-CON-TU-KEY}
      model: gemini-flash-latest
      endpoint: https://generativelanguage.googleapis.com/v1beta/models