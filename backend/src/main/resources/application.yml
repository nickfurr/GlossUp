spring:
  application:
    name: glossup-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/glossup
    username: glossup
    password: glossup
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Cambiado a 'update' para que genere o actualice las tablas automaticamente al arrancar
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  # Azure Container Apps (y Cloud Run) inyectan el puerto por la variable PORT.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

glossup:
  security:
    jwt:
      secret: cambia-este-secreto-de-desarrollo-min-32-bytes!!
      expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4200,http://localhost:3000