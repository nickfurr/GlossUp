name: Deploy to Azure Container Apps

# Cada push a main (de cualquier integrante) reconstruye y despliega la app.
# El build corre en el runner de GitHub (no en ACR Tasks, que la cuenta de estudiante bloquea).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  ACR: ca830bd7ba0eacr
  RESOURCE_GROUP: rg-glossup
  APP: glossup

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build y push de la imagen al ACR
        run: |
          # Usa las credenciales admin del ACR (el SP las lee con rol Contributor);
          # evita depender de permisos de data-plane del propio SP.
          az acr update -n "$ACR" --admin-enabled true -o none
          ACR_USER=$(az acr credential show -n "$ACR" --query username -o tsv)
          ACR_PASS=$(az acr credential show -n "$ACR" --query 'passwords[0].value' -o tsv)
          echo "$ACR_PASS" | docker login "$ACR.azurecr.io" -u "$ACR_USER" --password-stdin
          IMAGE="$ACR.azurecr.io/$APP:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Actualizar la Container App
        run: az containerapp update -n "$APP" -g "$RESOURCE_GROUP" --image "$IMAGE"
