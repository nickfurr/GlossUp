name: Deploy to Azure Container Apps

# Cada push a main (de cualquier integrante) prueba, reconstruye y despliega la app.
# En los Pull Request solo corren las pruebas, para ver el resultado antes de fusionar.
# El build corre en el runner de GitHub (no en ACR Tasks, que la cuenta de estudiante bloquea).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  ACR: glossup384495e6acr
  RESOURCE_GROUP: rg-glossup
  APP: glossup

jobs:
  # Si no compila o falla una prueba, no se despliega (auditoría R-02 / NC-T07).
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Falla si alguna dependencia (Maven con sus transitivas, npm) tiene una vulnerabilidad conocida (auditoría R-03).
      - name: Dependencias sin vulnerabilidades conocidas (OSV-Scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            ./

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend - compilar y probar (incluye Testcontainers con PostgreSQL)
        working-directory: backend
        run: ./mvnw -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - compilar y probar
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false
          npm run build

  deploy:
    needs: pruebas
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login a Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build y push de la imagen al ACR
        run: |
          # Usa las credenciales admin del ACR (el SP las lee con rol Contributor);
          # evita depender de permisos de data-plane del propio SP.
          az acr update -n "$ACR" --admin-enabled true -o none
          ACR_USER=$(az acr credential show -n "$ACR" --query username -o tsv)
          ACR_PASS=$(az acr credential show -n "$ACR" --query 'passwords[0].value' -o tsv)
          echo "$ACR_PASS" | docker login "$ACR.azurecr.io" -u "$ACR_USER" --password-stdin
          IMAGE="$ACR.azurecr.io/$APP:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Actualizar la Container App
        run: az containerapp update -n "$APP" -g "$RESOURCE_GROUP" --image "$IMAGE"
